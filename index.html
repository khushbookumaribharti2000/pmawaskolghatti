<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PM Awas Kolghatti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      padding: 28px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #2563eb;
    }

    .count {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .table-wrapper {
      background: white;
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #1d4ed8;
      color: white;
      padding: 14px 12px;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f8fafc;
    }

    .sex {
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .container {
        padding: 15px 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>PM Awas Kolghatti</h1>
  <p>प्रधानमंत्री आवास योजना – कोलघट्टी, हजारीबाग</p>
</header>

<main class="container">

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="नाम, पिता/पति का नाम, ब्लॉक या फ्लैट खोजें..."
    >

    <div class="count" id="count">
      Data लोड हो रहा है...
    </div>
  </div>

  <div id="errorBox"></div>

  <div id="loading" class="loading">
    Beneficiary data लोड हो रहा है...
  </div>

  <div class="table-wrapper" id="tableWrapper" style="display:none;">

    <table>
      <thead>
        <tr>
          <th>क्रमांक</th>
          <th>नाम</th>
          <th>Father / Husband Name</th>
          <th>Sex</th>
          <th>Block</th>
          <th>Flat</th>
        </tr>
      </thead>

      <tbody id="beneficiaryTable"></tbody>

    </table>

  </div>

</main>

<footer>
  © PM Awas Kolghatti
</footer>


<script>

  /* ==========================================
     SUPABASE SETTINGS
     ========================================== */

  const SUPABASE_URL = "https://cmzqgqrptqjbxuqagnue.supabase.co";

  const SUPABASE_ANON_KEY = ''sb_publishable_-QGSDfNjeHdCY_IpyQt12Q_c-Exsvyt'';


  /* ==========================================
     DATA
     ========================================== */

  let beneficiaries = [];


  /* ==========================================
     LOAD BENEFICIARY DATA
     ========================================== */

  async function loadBeneficiaries() {

    const loading =
      document.getElementById("loading");

    const tableWrapper =
      document.getElementById("tableWrapper");

    const errorBox =
      document.getElementById("errorBox");

    try {

      const url =
        SUPABASE_URL +
        "/rest/v1/Beneficiary" +
        "?select=beneficiary_name,father_husband_name,sex,block,flat_number" +
        "&order=beneficiary_name.asc";

      const response = await fetch(url, {

        method: "GET",

        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + SUPABASE_ANON_KEY
        }

      });


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          "Supabase error: " +
          response.status +
          " " +
          errorText
        );
      }


      beneficiaries =
        await response.json();


      loading.style.display = "none";

      tableWrapper.style.display = "block";

      displayData(beneficiaries);


    } catch (error) {

      loading.style.display = "none";

      errorBox.innerHTML = `
        <div class="error">
          <strong>Data load नहीं हो पाया।</strong>
          <br><br>
          ${escapeHTML(error.message)}
        </div>
      `;

      console.error(error);

    }

  }


  /* ==========================================
     DISPLAY DATA
     ========================================== */

  function displayData(data) {

    const table =
      document.getElementById("beneficiaryTable");

    const count =
      document.getElementById("count");


    table.innerHTML = "";


    count.innerText =
      "कुल Beneficiaries: " + data.length;


    if (data.length === 0) {

      table.innerHTML = `
        <tr>
          <td
            colspan="6"
            style="text-align:center;padding:30px;"
          >
            कोई रिकॉर्ड नहीं मिला।
          </td>
        </tr>
      `;

      return;
    }


    data.forEach((person, index) => {

      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(
            person.beneficiary_name
          )}
        </td>

        <td>
          ${escapeHTML(
            person.father_husband_name
          )}
        </td>

        <td class="sex">
          ${escapeHTML(
            person.sex
          )}
        </td>

        <td>
          ${escapeHTML(
            person.block
          )}
        </td>

        <td>
          ${escapeHTML(
            person.flat_number
          )}
        </td>

      `;


      table.appendChild(row);

    });

  }


  /* ==========================================
     SEARCH
     ========================================== */

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      function () {

        const search =
          this.value
            .trim()
            .toLowerCase();


        if (search === "") {

          displayData(beneficiaries);

          return;

        }


        const filtered =
          beneficiaries.filter(person => {

            const name =
              (person.beneficiary_name || "")
              .toLowerCase();

            const father =
              (person.father_husband_name || "")
              .toLowerCase();

            const sex =
              (person.sex || "")
              .toLowerCase();

            const block =
              (person.block || "")
              .toLowerCase();

            const flat =
              (person.flat_number || "")
              .toLowerCase();


            return (
              name.includes(search) ||
              father.includes(search) ||
              sex.includes(search) ||
              block.includes(search) ||
              flat.includes(search)
            );

          });


        displayData(filtered);

      }
    );


  /* ==========================================
     SECURITY
     ========================================== */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ==========================================
     START
     ========================================== */

  loadBeneficiaries();

</script>

</body>
</html>
